[project]
name = "invoiceiq"
version = "0.1.0"
description = "Multi-tenant SaaS that turns supplier invoice PDFs into validated, structured data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "python-multipart>=0.0.9",
    "pdfplumber>=0.11",
    "openpyxl>=3.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "ruff>=0.5", "reportlab>=4.0", "playwright>=1.44"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["invoiceiq*"]

[tool.setuptools.package-data]
invoiceiq = ["static/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008"]  # FastAPI's Depends() in defaults is idiomatic

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff.lint.isort]
known-first-party = ["invoiceiq", "conftest"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]  # sys.path tweak before first-party import
