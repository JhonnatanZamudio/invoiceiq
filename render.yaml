# Render Blueprint: https://render.com/docs/blueprint-spec
# One web service (Docker) + managed Postgres. Original PDFs live in Postgres, so no disk is needed.
services:
  - type: web
    name: invoiceiq
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: invoiceiq-db
          property: connectionString
      - key: INVOICEIQ_SECRET_KEY
        generateValue: true
      - key: INVOICEIQ_LLM_PROVIDER
        value: fake            # set to anthropic|openai and add INVOICEIQ_LLM_API_KEY as a secret
      - key: INVOICEIQ_LLM_API_KEY
        sync: false

databases:
  - name: invoiceiq-db
    plan: basic-256mb
    databaseName: invoiceiq
    user: invoiceiq
